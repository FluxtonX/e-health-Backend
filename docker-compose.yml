version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ehealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ehealth_db
    ports:
      - "5432:5432"
    volumes:
      - ehealth_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ehealth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ehealth_redisdata:/data

volumes:
  ehealth_pgdata:
  ehealth_redisdata:
